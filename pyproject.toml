[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecospheric-harness"
version = "0.1.0"
description = "Ecospheric Agent Harness — orchestrates ETP tools (EDD, ESE)"
requires-python = ">=3.11"
dependencies = [
    "etp>=0.1.0",
    "pyproj",
    "httpx",
    "geopandas",
    "shapely",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rio-tiler>=7.0",
    "rasterio>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["ecospheric_harness*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
[[tool.mypy.overrides]]
module = ["etp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
